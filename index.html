<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payroll Bookkeeping</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-strong: #0ea5e9;
    --green: #34d399;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #16233d, #0f172a);
  }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  /* Page nav */
  .nav { display: flex; gap: 8px; margin: 14px 0 0; }
  .nav a {
    text-decoration: none;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 600;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active { background: var(--accent-strong); color: #04121d; border-color: var(--accent-strong); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; max-width: 1100px; margin: 20px auto 0; padding: 0 24px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    color: var(--muted);
    border-radius: 10px 10px 0 0;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--accent-strong); }
  .board { display: none; }
  .board.active { display: block; }

  /* Summary cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .card.total .value { color: var(--green); }

  /* Form */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 26px;
  }
  .panel h2 { margin: 0 0 16px; font-size: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 150px; }
  .field.name { flex: 2 1 200px; }
  .field label { font-size: 12px; color: var(--muted); }
  .dual { display: flex; gap: 6px; }
  .dual input { text-align: center; }
  input {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.12s ease;
  }
  button:hover { filter: brightness(1.1); }
  .btn-primary { background: var(--accent-strong); color: #04121d; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }
  .btn-edit { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }

  /* Segmented pay-basis toggle */
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
  .segmented button { background: var(--panel-2); color: var(--muted); border-radius: 0; padding: 9px 16px; font-size: 13px; font-weight: 600; }
  .segmented button:hover { filter: none; color: var(--text); }
  .segmented button + button { border-left: 1px solid var(--line); }
  .segmented button.active { background: var(--accent-strong); color: #04121d; }

  /* Table */
  .table-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .table-head h2 { margin: 0; font-size: 16px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--panel-2); }
  tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: none; }
  tfoot .green { color: var(--green); }
  .empty { text-align: center; color: var(--muted); padding: 36px 10px; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--accent); background: rgba(14,165,233,0.10); }

  /* Checkboxes + bulk bar */
  input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent-strong); cursor: pointer; }
  th.check, td.check { width: 34px; text-align: center; }
  .bulkbar {
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--accent-strong);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .bulkbar.show { display: flex; }
  .bulkbar .count { font-weight: 600; color: var(--accent); }
  .bulkbar .spacer { flex: 1; }
  tr.selected { background: rgba(14,165,233,0.12); }

  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }

  /* Send / acknowledge + drag-and-drop */
  .dropzone {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 22px;
    color: var(--muted);
    font-size: 13px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel);
    transition: border-color .12s ease, background .12s ease;
  }
  .dropzone.drag { border-color: var(--accent-strong); background: var(--panel-2); color: var(--text); }
  .dropzone .dz-icon { font-size: 22px; }
  .dropzone strong { color: var(--text); }
  .dropzone .spacer { flex: 1; }
  .badge-ack { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
  .badge-ack.ok { color: var(--green); background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.40); }
  .badge-ack.sent { color: var(--warn); background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.35); }
  .btn-send { background: transparent; color: var(--green); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--panel-2); color: var(--text); border: 1px solid var(--accent-strong);
    padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 720px) {
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <h1>💼 Payroll Bookkeeping</h1>
  <p>Separate payrolls for drivers and for management &amp; back office — weekly, monthly, and projected yearly pay.</p>
  <nav class="nav">
    <a href="index.html" class="active">🚚 Payroll</a>
    <a href="expenses.html">🧾 Expenses</a>
  </nav>
</header>

<div class="tabs" id="tabs">
  <button type="button" class="tab active" data-tab="drivers">🚚 Drivers</button>
  <button type="button" class="tab" data-tab="staff">🧑‍💼 Management &amp; Back Office</button>
</div>

<div class="wrap">
  <div class="board active" id="board-drivers"></div>
  <div class="board" id="board-staff"></div>
</div>

<script>
  const WEEKS_PER_YEAR = 52;

  // --- shared helpers ---
  const money = n => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = n => (Number(n) || 0);
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const basisLabel = b => (b === "weekly" ? "Weekly" : "Yearly");

  // Weekly/monthly/yearly from whichever pay model the record uses.
  function calc(d) {
    let weekly;
    if (d.basis === "weekly") weekly = num(d.amount);
    else if (d.basis === "yearly") weekly = num(d.amount) / WEEKS_PER_YEAR;
    else weekly = num(d.daily) * num(d.days); // daily model (drivers)
    const yearly = weekly * WEEKS_PER_YEAR;
    return { weekly, monthly: yearly / 12, yearly };
  }
  function formatService(d) {
    const y = num(d.years), m = num(d.months);
    const parts = [];
    if (y) parts.push(y + " yr");
    if (m) parts.push(m + " mo");
    return parts.length ? parts.join(" ") : "0";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function migrate(list, hasTitle) {
    for (const d of list) {
      // migrate old hourly records (rate/hours) to daily salary, preserving weekly pay
      if (d.daily === undefined && d.rate !== undefined) {
        const weekly = (Number(d.rate) || 0) * (Number(d.hours) || 0);
        d.days = 5;
        d.daily = d.days ? weekly / d.days : 0;
        delete d.rate; delete d.hours;
      }
      // split a decimal "years of service" (e.g. 1.5) into whole years + months
      if (d.months === undefined) {
        const y = Number(d.years) || 0;
        d.years = Math.floor(y);
        d.months = Math.round((y - d.years) * 12);
        if (d.months === 12) { d.years += 1; d.months = 0; }
      }
      if (hasTitle && d.title === undefined) d.title = "";
    }
    return list;
  }

  // --- payroll board factory ---
  function createPayroll(cfg) {
    const { mount, storageKey, formTitle, countLabel, hasTitle, mode, fileBase, seed } = cfg;
    const salary = mode === "salary";
    const colspan = 9 + (hasTitle ? 1 : 0);

    let items = load();
    let editingId = null;
    let formBasis = "yearly"; // salary mode only
    const selected = new Set();
    if (salary) save(); // persist any legacy→salary migration

    function load() {
      let list = null;
      try { list = JSON.parse(localStorage.getItem(storageKey)); } catch { list = null; }
      if (list === null) {
        const base = salary
          ? { years: 0, months: 0, basis: "yearly", amount: 0, title: "" }
          : { years: 0, months: 0, daily: 0, days: 5, title: "" };
        list = (seed || []).map(s => ({ id: uid(), ...base, ...s }));
        if (seed && seed.length) localStorage.setItem(storageKey, JSON.stringify(list));
      }
      migrate(list, hasTitle);
      if (salary) {
        // convert any legacy daily-model records to a salary basis
        for (const d of list) {
          if (d.basis === undefined) {
            const wk = num(d.daily) * num(d.days);
            if (wk > 0) { d.basis = "weekly"; d.amount = wk; }
            else { d.basis = "yearly"; d.amount = num(d.amount) || 0; }
          }
          if (d.amount === undefined) d.amount = 0;
        }
      }
      return list;
    }
    function save() { localStorage.setItem(storageKey, JSON.stringify(items)); }

    // --- pay-model specific markup ---
    const payFormFields = salary ? `
          <div class="field">
            <label>Pay basis</label>
            <div class="segmented" data-basis-toggle>
              <button type="button" data-basis="weekly">Weekly</button>
              <button type="button" data-basis="yearly">Yearly</button>
            </div>
          </div>
          <div class="field">
            <label data-amount-label>Yearly salary ($)</label>
            <input class="f-amount" type="number" min="0" step="0.01" placeholder="0.00" required />
          </div>` : `
          <div class="field">
            <label>Daily pay / salary ($)</label>
            <input class="f-daily" type="number" min="0" step="0.01" placeholder="0.00" required />
          </div>
          <div class="field">
            <label>Days / week</label>
            <input class="f-days" type="number" min="0" max="7" step="0.5" placeholder="5" />
          </div>`;
    const payHeaders = salary
      ? `<th>Pay basis</th><th class="num">Rate</th>`
      : `<th class="num">Daily pay</th><th class="num">Days / wk</th>`;
    const note = salary
      ? "Enter each person's pay as a weekly or yearly salary — click the basis to switch. Weekly, monthly, and yearly totals are calculated from it. Data is saved in this browser on this computer."
      : "Weekly = daily pay × days/week. Yearly projection = weekly pay × 52 weeks. Monthly = yearly ÷ 12. Data is saved in this browser on this computer.";

    // --- markup ---
    mount.innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">${countLabel}</div><div class="value" data-sum="count">0</div></div>
        <div class="card"><div class="label">Total Weekly</div><div class="value" data-sum="weekly">$0</div></div>
        <div class="card"><div class="label">Total Monthly</div><div class="value" data-sum="monthly">$0</div></div>
        <div class="card total"><div class="label">Projected Yearly</div><div class="value" data-sum="yearly">$0</div></div>
      </div>

      <div class="dropzone" data-dropzone>
        <span class="dz-icon">📥</span>
        <div>
          <strong>Drag &amp; drop a file here</strong> — drop an employee's <em>acknowledgment</em> file to mark them accepted,
          or a <em>backup</em> file to restore this roster.
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn-ghost" data-choose-file>Choose file…</button>
        <input type="file" accept=".json,application/json" hidden data-file-input />
      </div>

      <div class="panel">
        <h2 data-form-title>${formTitle.add}</h2>
        <form data-form>
          <div class="field name">
            <label>Name</label>
            <input class="f-name" type="text" placeholder="e.g. John Smith" required />
          </div>
          ${hasTitle ? `
          <div class="field">
            <label>Title / role</label>
            <input class="f-title" type="text" placeholder="e.g. Operations manager" />
          </div>` : ``}
          <div class="field">
            <label>Years of service</label>
            <div class="dual">
              <input class="f-years" type="number" min="0" step="1" placeholder="Yr" aria-label="Years of service" title="Years" />
              <input class="f-months" type="number" min="0" max="11" step="1" placeholder="Mo" aria-label="Months of service" title="Months (0-11)" />
            </div>
          </div>
          ${payFormFields}
          <div class="toolbar">
            <button type="submit" class="btn-primary" data-submit>${formTitle.add}</button>
            <button type="button" class="btn-ghost" data-cancel style="display:none;">Cancel</button>
          </div>
        </form>
        <p class="note">${note}</p>
      </div>

      <div class="panel">
        <div class="table-head">
          <h2>${countLabel}</h2>
          <div class="toolbar">
            <button type="button" class="btn-ghost" data-excel>Download Excel</button>
            <button type="button" class="btn-ghost" data-csv>Export CSV</button>
            <button type="button" class="btn-ghost" data-backup>Backup file</button>
            <button type="button" class="btn-ghost" data-clear>Clear all</button>
          </div>
        </div>
        <div class="bulkbar" data-bulkbar>
          <span class="count" data-bulk-count>0 selected</span>
          <span class="spacer"></span>
          <button type="button" class="btn-ghost" data-bulk-excel>Export selected (Excel)</button>
          <button type="button" class="btn-ghost" data-bulk-csv>Export selected (CSV)</button>
          <button type="button" class="btn-danger" data-bulk-del>Delete selected</button>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="check"><input type="checkbox" data-select-all title="Select all" /></th>
              <th>Name</th>
              ${hasTitle ? `<th>Title / role</th>` : ``}
              <th class="num">Service</th>
              ${payHeaders}
              <th class="num">Weekly</th>
              <th class="num">Monthly</th>
              <th class="num">Yearly (proj.)</th>
              <th class="num">Actions</th>
            </tr>
          </thead>
          <tbody data-tbody></tbody>
          <tfoot data-tfoot></tfoot>
        </table>
        </div>
      </div>`;

    // --- scoped refs ---
    const q = sel => mount.querySelector(sel);
    const form = q("[data-form]");
    const tbody = q("[data-tbody]");
    const tfoot = q("[data-tfoot]");
    const els = {
      name: q(".f-name"),
      title: hasTitle ? q(".f-title") : null,
      years: q(".f-years"),
      months: q(".f-months"),
      daily: salary ? null : q(".f-daily"),
      days: salary ? null : q(".f-days"),
      amount: salary ? q(".f-amount") : null,
      submitBtn: q("[data-submit]"),
      cancelBtn: q("[data-cancel]"),
      formTitleEl: q("[data-form-title]"),
    };

    // --- pay-basis toggle (salary mode) ---
    function setBasis(b) {
      formBasis = b;
      if (!salary) return;
      for (const btn of mount.querySelectorAll("[data-basis-toggle] button"))
        btn.classList.toggle("active", btn.getAttribute("data-basis") === b);
      const lbl = q("[data-amount-label]");
      if (lbl) lbl.textContent = b === "weekly" ? "Weekly salary ($)" : "Yearly salary ($)";
    }
    if (salary) {
      q("[data-basis-toggle]").addEventListener("click", e => {
        const b = e.target.getAttribute("data-basis");
        if (b) setBasis(b);
      });
      setBasis(formBasis);
    }

    // --- render ---
    function payCells(d) {
      return salary
        ? `<td><span class="pill">${basisLabel(d.basis)}</span></td><td class="num">${money(d.amount)}</td>`
        : `<td class="num">${money(d.daily)}</td><td class="num">${num(d.days)}</td>`;
    }
    function render() {
      const ids = new Set(items.map(d => d.id));
      for (const id of [...selected]) if (!ids.has(id)) selected.delete(id);

      tbody.innerHTML = "";
      let tW = 0, tM = 0, tY = 0;

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colspan}" class="empty">No entries yet. Add one above to start tracking pay.</td></tr>`;
        tfoot.innerHTML = "";
      } else {
        for (const d of items) {
          const c = calc(d);
          tW += c.weekly; tM += c.monthly; tY += c.yearly;
          const isSel = selected.has(d.id);
          const tr = document.createElement("tr");
          if (isSel) tr.className = "selected";
          tr.innerHTML = `
            <td class="check"><input type="checkbox" data-sel="${d.id}" ${isSel ? "checked" : ""} /></td>
            <td>${escapeHtml(d.name)}${ackBadge(d)}</td>
            ${hasTitle ? `<td>${escapeHtml(d.title || "")}</td>` : ``}
            <td class="num">${formatService(d)}</td>
            ${payCells(d)}
            <td class="num">${money(c.weekly)}</td>
            <td class="num">${money(c.monthly)}</td>
            <td class="num">${money(c.yearly)}</td>
            <td class="num"><div class="actions">
              <button class="btn-send" data-send="${d.id}">Send</button>
              <button class="btn-edit" data-edit="${d.id}">Edit</button>
              <button class="btn-danger" data-del="${d.id}">Delete</button>
            </div></td>`;
          tbody.appendChild(tr);
        }
        tfoot.innerHTML = `
          <tr>
            <td></td>
            <td>Totals (${items.length})</td>
            ${hasTitle ? `<td></td>` : ``}
            <td></td><td></td><td></td>
            <td class="num">${money(tW)}</td>
            <td class="num">${money(tM)}</td>
            <td class="num green">${money(tY)}</td>
            <td></td>
          </tr>`;
      }

      q('[data-sum="count"]').textContent = items.length;
      q('[data-sum="weekly"]').textContent = money(tW);
      q('[data-sum="monthly"]').textContent = money(tM);
      q('[data-sum="yearly"]').textContent = money(tY);

      syncSelectionUI();
    }

    function syncSelectionUI() {
      const n = selected.size;
      q("[data-bulkbar]").classList.toggle("show", n > 0);
      q("[data-bulk-count]").textContent = n + " selected";
      const all = q("[data-select-all]");
      all.checked = items.length > 0 && n === items.length;
      all.indeterminate = n > 0 && n < items.length;
    }

    function selectedItems() { return items.filter(d => selected.has(d.id)); }

    // --- form submit (add or update) ---
    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        name: els.name.value.trim(),
        years: Math.floor(num(els.years.value)) + Math.floor(num(els.months.value) / 12),
        months: Math.floor(num(els.months.value)) % 12,
      };
      if (hasTitle) data.title = els.title.value.trim();
      if (salary) {
        data.basis = formBasis;
        data.amount = num(els.amount.value);
      } else {
        data.daily = num(els.daily.value);
        data.days = els.days.value === "" ? 5 : num(els.days.value);
      }
      const payValue = salary ? data.amount : data.daily;
      if (!data.name || payValue <= 0) return;

      if (editingId) {
        const d = items.find(x => x.id === editingId);
        if (d) Object.assign(d, data);
        exitEdit();
      } else {
        items.push({ id: uid(), ...data });
      }
      save();
      render();
      form.reset();
      if (salary) setBasis("yearly");
      els.name.focus();
    });

    // --- row clicks: select / edit / delete ---
    tbody.addEventListener("click", e => {
      const selId = e.target.getAttribute("data-sel");
      if (selId) {
        if (e.target.checked) selected.add(selId); else selected.delete(selId);
        const row = e.target.closest("tr");
        if (row) row.classList.toggle("selected", e.target.checked);
        syncSelectionUI();
        return;
      }
      const sendId = e.target.getAttribute("data-send");
      if (sendId) {
        const d = items.find(x => x.id === sendId);
        if (d) sendPacket(d);
        return;
      }
      const editId = e.target.getAttribute("data-edit");
      const delId = e.target.getAttribute("data-del");
      if (editId) startEdit(editId);
      if (delId) {
        const d = items.find(x => x.id === delId);
        if (d && confirm(`Delete ${d.name}?`)) {
          items = items.filter(x => x.id !== delId);
          if (editingId === delId) exitEdit();
          save(); render();
        }
      }
    });

    function startEdit(id) {
      const d = items.find(x => x.id === id);
      if (!d) return;
      editingId = id;
      els.name.value = d.name;
      if (hasTitle) els.title.value = d.title || "";
      els.years.value = d.years;
      els.months.value = d.months;
      if (salary) {
        setBasis(d.basis || "yearly");
        els.amount.value = d.amount;
      } else {
        els.daily.value = d.daily;
        els.days.value = d.days;
      }
      els.submitBtn.textContent = "Save changes";
      els.cancelBtn.style.display = "inline-block";
      els.formTitleEl.textContent = formTitle.edit;
      els.name.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function exitEdit() {
      editingId = null;
      els.submitBtn.textContent = formTitle.add;
      els.cancelBtn.style.display = "none";
      els.formTitleEl.textContent = formTitle.add;
      form.reset();
      if (salary) setBasis("yearly");
    }
    els.cancelBtn.addEventListener("click", exitEdit);

    // --- clear all ---
    q("[data-clear]").addEventListener("click", () => {
      if (items.length && confirm("Remove ALL entries in this payroll? This cannot be undone.")) {
        items = []; exitEdit(); save(); render();
      }
    });

    // --- select all + bulk actions ---
    q("[data-select-all]").addEventListener("change", e => {
      selected.clear();
      if (e.target.checked) for (const d of items) selected.add(d.id);
      render();
    });
    q("[data-bulk-del]").addEventListener("click", () => {
      const n = selected.size;
      if (n && confirm(`Delete ${n} selected entr${n === 1 ? "y" : "ies"}? This cannot be undone.`)) {
        items = items.filter(d => !selected.has(d.id));
        if (editingId && selected.has(editingId)) exitEdit();
        selected.clear();
        save(); render();
      }
    });
    q("[data-bulk-excel]").addEventListener("click", () => exportExcel(selectedItems(), `${fileBase}_selected.xlsx`));
    q("[data-bulk-csv]").addEventListener("click", () => exportCSV(selectedItems(), `${fileBase}_selected.csv`));

    // --- export CSV ---
    function exportCSV(list, filename) {
      if (!list.length) return;
      const payHead = salary ? ["Pay Basis", "Rate"] : ["Daily Pay", "Days per Week"];
      const header = ["Name", ...(hasTitle ? ["Title / role"] : []), "Years of Service", ...payHead, "Weekly", "Monthly", "Yearly (projected)"];
      const rows = [header];
      for (const d of list) {
        const c = calc(d);
        const payVals = salary ? [basisLabel(d.basis), num(d.amount)] : [num(d.daily), num(d.days)];
        rows.push([d.name, ...(hasTitle ? [d.title || ""] : []), formatService(d), ...payVals, c.weekly.toFixed(2), c.monthly.toFixed(2), c.yearly.toFixed(2)]);
      }
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    q("[data-csv]").addEventListener("click", () => exportCSV(items, `${fileBase}.csv`));

    // --- export Excel (.xlsx) ---
    function exportExcel(list, filename) {
      if (!list.length) return;
      if (typeof XLSX === "undefined") {
        alert("Excel export needs an internet connection to load. Use the CSV export instead — it opens in Excel too.");
        return;
      }
      const rows = list.map(d => {
        const c = calc(d);
        const payCols = salary
          ? { "Pay Basis": basisLabel(d.basis), "Rate": +num(d.amount).toFixed(2) }
          : { "Daily Pay": num(d.daily), "Days per Week": num(d.days) };
        return {
          "Name": d.name,
          ...(hasTitle ? { "Title / role": d.title || "" } : {}),
          "Years of Service": formatService(d),
          ...payCols,
          "Weekly": +c.weekly.toFixed(2),
          "Monthly": +c.monthly.toFixed(2),
          "Yearly (projected)": +c.yearly.toFixed(2),
        };
      });
      const t = list.reduce((a, d) => {
        const c = calc(d); a.w += c.weekly; a.m += c.monthly; a.y += c.yearly; return a;
      }, { w: 0, m: 0, y: 0 });
      const payTotals = salary ? { "Pay Basis": "", "Rate": "" } : { "Daily Pay": "", "Days per Week": "" };
      rows.push({
        "Name": "TOTALS", ...(hasTitle ? { "Title / role": "" } : {}), "Years of Service": "", ...payTotals,
        "Weekly": +t.w.toFixed(2), "Monthly": +t.m.toFixed(2), "Yearly (projected)": +t.y.toFixed(2),
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{ wch: 20 }, ...(hasTitle ? [{ wch: 22 }] : []), { wch: 16 }, { wch: 13 }, { wch: 14 }, { wch: 13 }, { wch: 13 }, { wch: 18 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, countLabel.slice(0, 31));
      XLSX.writeFile(wb, filename);
    }
    q("[data-excel]").addEventListener("click", () => exportExcel(items, `${fileBase}.xlsx`));

    // --- send / acknowledge / drag-drop ---
    let toastTimer = null;
    function toast(msg) {
      let t = document.getElementById("__toast");
      if (!t) { t = document.createElement("div"); t.id = "__toast"; t.className = "toast"; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3400);
    }
    function download(text, filename, mime) {
      const blob = new Blob([text], { type: mime || "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    const safeName = s => String(s).replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "") || "employee";

    function ackBadge(d) {
      if (d.ack && d.ack.accepted) {
        const dt = d.ack.at ? new Date(d.ack.at).toLocaleDateString() : "";
        return `<span class="badge-ack ok" title="Accepted by ${escapeHtml(d.ack.by || d.name)} ${escapeHtml(dt)}">✓ Accepted${dt ? " " + escapeHtml(dt) : ""}</span>`;
      }
      if (d.sent) {
        const dt = new Date(d.sent).toLocaleDateString();
        return `<span class="badge-ack sent" title="Packet sent ${escapeHtml(dt)}">Sent ${escapeHtml(dt)}</span>`;
      }
      return "";
    }

    function buildPacket(d) {
      const c = calc(d);
      const payLines = salary
        ? [["Pay basis", basisLabel(d.basis)], ["Rate", money(d.amount)]]
        : [["Daily pay", money(d.daily)], ["Days / week", String(num(d.days))]];
      const packet = {
        v: 1, company: "CRYXX Solutions and Associates Inc.",
        board: storageKey, boardLabel: countLabel,
        id: d.id, name: d.name, title: d.title || "", service: formatService(d),
        weekly: money(c.weekly), monthly: money(c.monthly), yearly: money(c.yearly),
        issuedAt: new Date().toISOString(),
      };
      const esc = escapeHtml;
      const payRows = payLines.map(([k, v]) => `<tr><td>${esc(k)}</td><td style="text-align:right">${esc(v)}</td></tr>`).join("");
      const issued = new Date(packet.issuedAt).toLocaleString();
      const titleRow = d.title ? `<div class="sub">${esc(d.title)}</div>` : "";
      return `<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pay Statement — ${esc(d.name)}</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.5;}
  .sheet{max-width:640px;margin:28px auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.08);}
  .hd{background:#0f172a;color:#fff;padding:22px 26px;}
  .hd h1{margin:0;font-size:20px;}
  .hd .co{color:#38bdf8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
  .bd{padding:24px 26px;}
  .who{font-size:20px;font-weight:700;margin:0;}
  .sub{color:#64748b;font-size:14px;margin-top:2px;}
  .meta{color:#64748b;font-size:12px;margin-top:6px;}
  table{width:100%;border-collapse:collapse;margin-top:18px;}
  td{padding:9px 4px;border-bottom:1px solid #eef2f7;font-size:14px;}
  .tot td{font-weight:700;border-top:2px solid #e2e8f0;border-bottom:none;}
  .tot .g{color:#059669;}
  .ack{margin:22px 26px;padding:18px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;}
  .ack h3{margin:0 0 8px;font-size:15px;}
  .ack p{margin:0 0 12px;font-size:13px;color:#475569;}
  .ack input{padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;width:100%;max-width:320px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  button{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;}
  .accept{background:#059669;color:#fff;}
  .print{background:#fff;color:#0f172a;border:1px solid #cbd5e1;}
  #ackStatus{margin-top:12px;font-size:13px;color:#059669;}
  .ft{padding:14px 26px;color:#94a3b8;font-size:11px;border-top:1px solid #eef2f7;}
  @media print{ body{background:#fff;} .sheet{box-shadow:none;border:none;margin:0;} .ack .row{display:none;} }
</style></head>
<body>
  <div class="sheet">
    <div class="hd"><h1>Pay Statement</h1><div class="co">${esc(packet.company)}</div></div>
    <div class="bd">
      <p class="who">${esc(d.name)}</p>
      ${titleRow}
      <div class="meta">${esc(packet.boardLabel)} &middot; Service: ${esc(packet.service)} &middot; Issued ${esc(issued)}</div>
      <table>
        ${payRows}
        <tr><td>Weekly pay</td><td style="text-align:right">${esc(packet.weekly)}</td></tr>
        <tr><td>Monthly pay</td><td style="text-align:right">${esc(packet.monthly)}</td></tr>
        <tr class="tot"><td>Yearly (projected)</td><td style="text-align:right" class="g">${esc(packet.yearly)}</td></tr>
      </table>
    </div>
    <div class="ack">
      <h3>Acknowledgment</h3>
      <p>Please confirm you have received and reviewed this pay statement. Type your name and click Accept &mdash; a small acknowledgment file will download that you send back to your employer.</p>
      <input id="ackName" type="text" value="${esc(d.name)}" placeholder="Type your full name" />
      <div class="row">
        <button id="acceptBtn" class="accept">&#10003; Accept &amp; Acknowledge</button>
        <button id="printBtn" class="print">Print / Save PDF</button>
      </div>
      <div id="ackStatus"></div>
    </div>
    <div class="ft">Generated for ${esc(d.name)} by ${esc(packet.company)}. Ref: ${esc(packet.id)}.</div>
  </div>
<script>
(function(){
  var P = ${JSON.stringify(packet)};
  var KEY = "cryxx_ack_" + P.id;
  var btn = document.getElementById("acceptBtn");
  var nameIn = document.getElementById("ackName");
  var statusEl = document.getElementById("ackStatus");
  function fmtDate(iso){ try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } }
  function saved(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
  function safe(s){ return String(s).replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+\$/g,"") || "employee"; }
  function makeReceipt(who, when){
    return { type:"payroll-ack", v:1, id:P.id, board:P.board, boardLabel:P.boardLabel, name:P.name,
             acceptedBy:who, acceptedAt:when, summary:{ weekly:P.weekly, monthly:P.monthly, yearly:P.yearly } };
  }
  function dl(obj, fname){
    var blob = new Blob([JSON.stringify(obj,null,2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  function showAccepted(rec){
    statusEl.innerHTML = '&#10003; Accepted by <b>' + (rec.acceptedBy || rec.name) + '</b> on ' + fmtDate(rec.acceptedAt) +
      '. <a href="#" id="redl">Download acknowledgment again</a> and send it back to your employer.';
    btn.disabled = true; btn.textContent = "Accepted ✓"; nameIn.disabled = true;
    var r = document.getElementById("redl");
    if (r) r.addEventListener("click", function(ev){ ev.preventDefault(); dl(rec, "acknowledgment_" + safe(P.name) + ".json"); });
  }
  var existing = saved();
  if (existing) showAccepted(existing);
  btn.addEventListener("click", function(){
    var who = (nameIn.value || "").trim() || P.name;
    var rec = makeReceipt(who, new Date().toISOString());
    try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch(e){}
    dl(rec, "acknowledgment_" + safe(P.name) + ".json");
    showAccepted(rec);
  });
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
})();
<\/script>
</body></html>`;
    }

    function sendPacket(d) {
      download(buildPacket(d), safeName(d.name) + "_pay_packet.html", "text/html");
      if (!d.sent) d.sent = new Date().toISOString();
      save(); render();
      toast("Pay packet for " + d.name + " downloaded — send it to them.");
    }

    function exportBackup() {
      const obj = { type: "payroll-data", v: 1, board: storageKey, boardLabel: countLabel, exportedAt: new Date().toISOString(), items };
      download(JSON.stringify(obj, null, 2), fileBase + "_backup.json", "application/json");
      toast("Backup file for " + countLabel + " downloaded.");
    }
    q("[data-backup]").addEventListener("click", exportBackup);

    function applyImport(obj) {
      if (!obj || typeof obj !== "object") { toast("Unrecognized file."); return; }
      if (obj.type === "payroll-ack") {
        if (obj.board && obj.board !== storageKey) {
          toast("That acknowledgment is for the " + (obj.boardLabel || "other") + " payroll — switch to that tab and drop it there.");
          return;
        }
        const d = items.find(x => x.id === obj.id);
        if (!d) { toast("No matching employee found for that acknowledgment (they may have been removed)."); return; }
        d.ack = { accepted: true, by: obj.acceptedBy || d.name, at: obj.acceptedAt || new Date().toISOString() };
        save(); render();
        toast("✓ " + d.name + " marked as accepted.");
        return;
      }
      if (obj.type === "payroll-data" && Array.isArray(obj.items)) {
        const label = obj.boardLabel || "another payroll";
        if (obj.board && obj.board !== storageKey &&
            !confirm("This backup is from " + label + ". Import it into " + countLabel + " anyway? This replaces the current list.")) return;
        if (!confirm("Restore " + obj.items.length + " entr" + (obj.items.length === 1 ? "y" : "ies") + " into " + countLabel + "? This replaces the current list.")) return;
        items = obj.items.map(x => ({ id: x.id || uid(), ...x }));
        migrate(items, hasTitle);
        exitEdit(); save(); render();
        toast("Restored " + items.length + " entries into " + countLabel + ".");
        return;
      }
      toast("Unrecognized file — expected an acknowledgment or a backup file.");
    }
    function importFile(file) {
      const reader = new FileReader();
      reader.onload = () => { try { applyImport(JSON.parse(reader.result)); } catch (e) { toast("Could not read that file — it isn't valid JSON."); } };
      reader.readAsText(file);
    }

    const dz = q("[data-dropzone]");
    const fileInput = q("[data-file-input]");
    ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("drag"); }));
    ["dragleave", "dragend"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("drag"); }));
    dz.addEventListener("drop", e => {
      e.preventDefault(); dz.classList.remove("drag");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) importFile(f);
    });
    q("[data-choose-file]").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", e => { const f = e.target.files[0]; if (f) importFile(f); fileInput.value = ""; });

    render();
  }

  // --- drivers board (daily pay model) ---
  createPayroll({
    mount: document.getElementById("board-drivers"),
    storageKey: "driver_payroll_v1",
    countLabel: "Drivers",
    formTitle: { add: "Add a driver", edit: "Edit driver" },
    hasTitle: false,
    mode: "daily",
    fileBase: "driver_payroll",
  });

  // --- management & back office board (weekly/yearly salary model, seeded roster) ---
  createPayroll({
    mount: document.getElementById("board-staff"),
    storageKey: "staff_payroll_v1",
    countLabel: "Management & Back Office",
    formTitle: { add: "Add a staff member", edit: "Edit staff member" },
    hasTitle: true,
    mode: "salary",
    fileBase: "management_backoffice_payroll",
    seed: [
      { name: "Camille Harris", title: "BC" },
      { name: "Jabria Harper Garner", title: "Back office" },
      { name: "Drew Fraser", title: "Back office tech support" },
      { name: "Joe Chairez", title: "Operations manager" },
      { name: "Luis Hernandez", title: "Operations manager" },
    ],
  });

  // --- tab switching ---
  const boards = { drivers: document.getElementById("board-drivers"), staff: document.getElementById("board-staff") };
  document.getElementById("tabs").addEventListener("click", e => {
    const name = e.target.getAttribute("data-tab");
    if (!name) return;
    for (const t of document.querySelectorAll(".tab")) t.classList.toggle("active", t.getAttribute("data-tab") === name);
    for (const key in boards) boards[key].classList.toggle("active", key === name);
  });
</script>
</body>
</html>
